name: Offline and mocked calendar safety tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }} / ${{ matrix.layer }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            layer: base
            sync_args: --extra dev
            pytest_args: -m "not google_read and not google_test_write"
          - os: windows-latest
            layer: base
            sync_args: --extra dev
            pytest_args: -m "not google_read and not google_test_write"
          - os: ubuntu-latest
            layer: google-read
            sync_args: --extra dev --extra google-read
            pytest_args: -m google_read
          - os: windows-latest
            layer: google-read
            sync_args: --extra dev --extra google-read
            pytest_args: -m google_read
          - os: ubuntu-latest
            layer: google-test-write
            sync_args: --extra dev --extra google-test-write
            pytest_args: -m google_test_write
          - os: windows-latest
            layer: google-test-write
            sync_args: --extra dev --extra google-test-write
            pytest_args: -m google_test_write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        if: matrix.layer == 'google-read' || matrix.layer == 'google-test-write'
        run: uv run --frozen mypy --strict src

      - name: Run isolated test layer
        run: uv run --frozen pytest ${{ matrix.pytest_args }}

      - name: Build package
        run: uv run --frozen python -m build
