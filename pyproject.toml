[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tridentine-calendar-ja-google-sync"
version = "0.1.0"
description = "Offline-first tooling for safely validating and comparing the accepted Japanese Roman liturgical calendar with Google Calendar."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Blue-jp" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "icalendar>=6,<7",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "pytest-socket>=0.7,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
tridentine-calendar-google-sync = "tridentine_calendar_google_sync.cli:main"

[project.urls]
Repository = "https://github.com/Blue-jp/tridentine-calendar-ja-google-sync"
Issues = "https://github.com/Blue-jp/tridentine-calendar-ja-google-sync/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/profiles",
  "/schemas",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tridentine_calendar_google_sync"]

[tool.hatch.build.targets.wheel.force-include]
"profiles/accepted-20260814.toml" = "tridentine_calendar_google_sync/_profiles/accepted-20260814.toml"
"schemas" = "tridentine_calendar_google_sync/_schemas"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--disable-socket",
]
testpaths = ["tests"]
markers = [
  "integration: opt-in test requiring a verified Accepted ICS file outside the repository",
]

[tool.coverage.run]
branch = true
source = ["tridentine_calendar_google_sync"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tridentine_calendar_google_sync"]
